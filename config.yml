version: 1
build:
  proto:
    path: proto
    third_party_paths:
      - third_party/proto
      - proto_vendor

accounts:
  - name: treasury
    coins: ["2250000000ryal"]
  - name: ecosystem
    coins: ["900000000ryal"]
  - name: team
    coins: ["675000000ryal"]
  - name: marketing
    coins: ["450000000ryal"]
  - name: reserve
    coins: ["225000000ryal"]
    
validators:
  - name: treasury
    bonded: "100000000ryal"
    
client:
  openapi:
    path: docs/static/openapi.yml
  typescript:
    path: ts-client
  vuex:
    path: vue/src/store

genesis:
  chain_id: "baronchain-1"
  app_state:
    staking:
      params:
        bond_denom: "ryal"
    mint:
      params:
        mint_denom: "ryal"
        inflation_rate_change: "0.000000000000000000"
        inflation_max: "0.000000000000000000"
        inflation_min: "0.000000000000000000"
        goal_bonded: "0.670000000000000000"
        blocks_per_year: "6311520"
    crisis:
      constant_fee:
        denom: "ryal"
    gov:
      deposit_params:
        min_deposit:
          - amount: "10000000"
            denom: "ryal"

faucet:
  name: ecosystem
  coins: ["1000ryal"]
  host: 0.0.0.0:4500
  rate_limit_window: "24h"
  tokens_per_request: ["100ryal"]